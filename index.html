<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather and air quality</title>
<meta name="description" content="Live weather, forecast and air quality for Lucknow and any area you search.">
<meta name="theme-color" content="#0b0b0c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%81%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header class="top">
    <form id="search">
      <div class="search-box">
        <input id="q" type="search" placeholder="Search a city, locality or area" aria-label="Search a city, locality or area" autocomplete="off">
        <ul id="suggestions" class="suggestions" hidden></ul>
      </div>
      <button type="submit">Search</button>
    </form>
    <button id="locationBtn" class="location-btn" type="button">◎ Select my location</button>
    <p id="status" role="status"></p>
  </header>

  <section class="hero" aria-label="Current weather">
    <canvas id="scene" aria-hidden="true"></canvas>
    <div class="hero-text">
      <p class="place" id="place">No location selected</p>
      <p class="temp" id="temp">--°</p>
      <p class="cond" id="cond">Search for a place or select your location</p>
      <p class="sub" id="sub"></p>
    </div>
  </section>

  <section class="tiles" id="tiles" aria-label="Conditions"></section>

  <section aria-labelledby="h-air">
    <h2 id="h-air">Air quality</h2>
    <div class="air" id="air"></div>
  </section>

  <section aria-labelledby="h-hours">
    <h2 id="h-hours">Next 24 hours</h2>
    <div class="hours" id="hours"></div>
  </section>

  <section aria-labelledby="h-days">
    <h2 id="h-days">Next 7 days</h2>
    <ul class="days" id="days"></ul>
  </section>

  <footer>Weather from Open-Meteo. Air quality uses WAQI with Open-Meteo fallback and the US AQI scale.</footer>
</main>
<script src="app.js"></script>
</body>
</html>
